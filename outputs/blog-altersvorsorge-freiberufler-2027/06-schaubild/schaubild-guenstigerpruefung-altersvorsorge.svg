<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 536" role="img"
     aria-labelledby="t d" font-family="Georgia, 'Times New Roman', serif">
  <title id="t">Günstigerprüfung beim Altersvorsorgevertrag: Gefördert wird das Höhere von Zulage und Steuerersparnis</title>
  <desc id="d">Gegenüberstellung zweier Modellfälle nach dem Einkommensteuertarif 2026. Links eine ledige
  Zahnärztin ohne Kinder mit 90.000 Euro zu versteuerndem Einkommen und 1.800 Euro Eigenbeitrag:
  Zulagen 540 Euro, Steuerersparnis aus dem Sonderausgabenabzug 983 Euro, Einzahlung in den Vertrag
  2.340 Euro. Es gilt die Steuerersparnis, die Förderung beträgt 983 Euro. Rechts ein verheirateter
  Architekt mit zwei Kindern, 150.000 Euro gemeinsamem zu versteuerndem Einkommen und 300 Euro
  Eigenbeitrag: Zulagen 750 Euro, Steuerersparnis aus dem Abzug 442 Euro, Einzahlung in den Vertrag
  1.050 Euro. Es gilt die Zulage, die Förderung beträgt 750 Euro. Der Staat trägt bei der Zahnärztin
  42 Prozent der Einzahlung, das entspricht ihrem Grenzsteuersatz, beim Architekten 71 Prozent; dort
  trägt die Kinderzulage den größten Teil.</desc>

  <rect width="880" height="536" fill="#FFFFFF"/>

  <text x="36" y="42" font-size="21" font-weight="bold" fill="#3A5791">Gefördert wird das Höhere von beidem</text>
  <text x="36" y="66" font-size="14" fill="#5A6070">Günstigerprüfung an zwei Modellfällen: Zulagen oder Steuerersparnis aus dem Sonderausgabenabzug</text>
  <rect x="36" y="80" width="64" height="4" rx="2" fill="#F7B234"/>

  <!-- Links: Steuerabzug gewinnt -->
  <rect x="36" y="112" width="384" height="238" rx="6" fill="#F6F8FB" stroke="#D8DEE9"/>
  <text x="60" y="144" font-size="15" font-weight="bold" fill="#3A5791">Zahnärztin, ledig, ohne Kinder</text>
  <text x="60" y="166" font-size="13" fill="#5A6070">Einkommen 90.000 EUR, Eigenbeitrag 1.800 EUR</text>

  <text x="60" y="200" font-size="13" fill="#333333">Zulagen</text>
  <text x="396" y="200" font-size="13" fill="#333333" text-anchor="end">540 EUR</text>
  <text x="60" y="226" font-size="13" font-weight="bold" fill="#3A5791">Steuerersparnis aus dem Abzug</text>
  <text x="396" y="226" font-size="13" font-weight="bold" fill="#3A5791" text-anchor="end">983 EUR</text>
  <text x="60" y="252" font-size="13" fill="#333333">Einzahlung in den Vertrag</text>
  <text x="396" y="252" font-size="13" fill="#333333" text-anchor="end">2.340 EUR</text>

  <line x1="60" y1="270" x2="396" y2="270" stroke="#C9D2E0"/>
  <text x="60" y="298" font-size="13" fill="#5A6070">Es gilt die Steuerersparnis</text>
  <text x="60" y="330" font-size="24" font-weight="bold" fill="#3A5791">983 EUR</text>

  <!-- Rechts: Zulage gewinnt (hervorgehoben) -->
  <rect x="460" y="112" width="384" height="238" rx="6" fill="#FDF3E0" stroke="#F7B234" stroke-width="2"/>
  <text x="484" y="144" font-size="15" font-weight="bold" fill="#3A5791">Architekt, verheiratet, zwei Kinder</text>
  <text x="484" y="166" font-size="13" fill="#5A6070">Einkommen 150.000 EUR, Eigenbeitrag 300 EUR</text>

  <text x="484" y="200" font-size="13" font-weight="bold" fill="#3A5791">Zulagen</text>
  <text x="820" y="200" font-size="13" font-weight="bold" fill="#3A5791" text-anchor="end">750 EUR</text>
  <text x="484" y="226" font-size="13" fill="#333333">Steuerersparnis aus dem Abzug</text>
  <text x="820" y="226" font-size="13" fill="#333333" text-anchor="end">442 EUR</text>
  <text x="484" y="252" font-size="13" fill="#333333">Einzahlung in den Vertrag</text>
  <text x="820" y="252" font-size="13" fill="#333333" text-anchor="end">1.050 EUR</text>

  <line x1="484" y1="270" x2="820" y2="270" stroke="#EBC98A"/>
  <text x="484" y="298" font-size="13" fill="#5A6070">Es gilt die Zulage, trotz hohen Einkommens</text>
  <text x="484" y="330" font-size="24" font-weight="bold" fill="#3A5791">750 EUR</text>

  <!-- Ergebniszeile -->
  <rect x="36" y="366" width="808" height="112" rx="6" fill="#3A5791"/>
  <text x="60" y="394" font-size="15" font-weight="bold" fill="#FFFFFF">Anteil des Staates an der Einzahlung</text>
  <text x="60" y="420" font-size="13" fill="#C3D2E8">Zahnärztin</text>
  <text x="60" y="446" font-size="20" font-weight="bold" fill="#F7B234">42 %</text>
  <text x="60" y="466" font-size="13" fill="#C3D2E8">entspricht ihrem Grenzsteuersatz</text>
  <text x="484" y="420" font-size="13" fill="#C3D2E8">Architekt</text>
  <text x="484" y="446" font-size="20" font-weight="bold" fill="#F7B234">71 %</text>
  <text x="484" y="466" font-size="13" fill="#C3D2E8">die Kinderzulage trägt den größten Teil</text>

  <text x="36" y="502" font-size="11" fill="#5A6070">Modellrechnung nach dem Einkommensteuertarif 2026, ohne Solidaritätszuschlag und Kirchensteuer.</text>
  <text x="36" y="518" font-size="11" fill="#5A6070">Einkommen: zu versteuerndes Einkommen, beim Architekten gemeinsam. Die Kinderzulage ist ihm zugeordnet.</text>
</svg>
