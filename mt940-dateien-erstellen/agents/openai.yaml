interface:
  display_name: "MT940-Dateien erstellen"
  short_description: "MT940 vollständig prüfen und neue Bankmodelle lernen"
  default_prompt: "Nutze $mt940-dateien-erstellen: Lies den Kontoauszug aus, erzeuge MT940 und prüfe jedes Feld sowie den vollständigen Buchungstext gegen die Originalquelle; korrigiere und erzeuge bei Fehlern erneut und speichere nach erfolgreicher Prüfung ein neues Bankmodell, falls noch keines vorhanden ist."
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/icon.svg"
policy:
  allow_implicit_invocation: true
